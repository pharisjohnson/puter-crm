<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sales CRM (PocketBase)</title>
  <meta name="description" content="Leads, companies, deal stages, follow-ups, meeting history, and sales forecasts. Self-hosted on PocketBase." />
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sales CRM" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <script>
    (() => {
      try {
        const t = localStorage.getItem('crm:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <script type="module" src="/src/pocketbase-main.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
</body>
</html>
